<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campus plan — Foundry</title>
<meta name="description" content="The Foundry campus plan now lives on the home page." />
<!--
  This page used to carry its own complete copy of the campus plan: a second
  SVG, a second set of 15 blocks, a second copy of the panel logic. Two
  implementations of one map drift apart, and the copy here ignored every query
  parameter, so an inbound ?location= did nothing.

  The home page plan is now the single implementation. This file exists only so
  old links keep working, and it forwards the query string so deep links still
  land on the right place.
-->
<link rel="stylesheet" href="assets/css/foundit.css?v=20261127e" />
<script>
  (function () {
    var q = window.location.search || '';
    // index.html reads ?location= itself, so pass it straight through.
    window.location.replace('index.html' + q + (q ? '&' : '?') + 'from=explorer#cplan');
  })();
</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="wrap" style="padding:3rem 0">
    <h1 class="display">Campus plan</h1>
    <p>The campus plan is now part of the home page.</p>
    <p><a class="btn btn--solid" href="index.html#cplan">Open the campus plan</a></p>
    <noscript>
      <p>JavaScript is off, so the automatic redirect did not run. Use the link above.</p>
    </noscript>
  </main>
<script src="assets/js/theme.js?v=20261127e"></script>
</body>
</html>
