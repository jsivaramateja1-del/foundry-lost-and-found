<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset password — Foundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="assets/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/foundit.css" />
  <meta name="theme-color" content="#F4EDE0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a href="index.html" class="logo">foundry <span>Sai Campus / Lost + Found</span></a>
      <div class="header-actions">
        <button class="btn btn--ghost theme-toggle" data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme">
          <span data-theme-icon>☾</span>
        </button>
        <a href="auth.html" class="btn btn--ghost">Log in</a>
      </div>
    </div>
  </header>

  <main class="auth-shell auth-shell--single" id="main">
    <section class="auth-panel rv rv-d1">
      <div class="auth-panel__inner">
        <p class="eyebrow">Account recovery</p>
        <h2 class="display">Choose a new password</h2>

        <form id="reset-form" novalidate>
          <div class="form-error" id="reset-error" role="alert"></div>
          <p class="form-note" id="reset-success" role="status"></p>
          <div class="field">
            <label for="reset-password">New password</label>
            <div class="password-field">
              <input class="input" type="password" id="reset-password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
              <button type="button" class="password-field__toggle" data-toggle-password="reset-password" aria-label="Show password">
                <svg class="eye eye--open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 12S5.5 5.5 12 5.5 22.5 12 22.5 12 18.5 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
                <svg class="eye eye--closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A11 11 0 0112 6c6.5 0 10.5 6 10.5 6a19 19 0 01-3.4 4M6.3 7.4A19 19 0 001.5 12S5.5 18 12 18a10.6 10.6 0 004.6-1"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="reset-confirm">Confirm new password</label>
            <div class="password-field">
              <input class="input" type="password" id="reset-confirm" autocomplete="new-password" required minlength="8" placeholder="Type it again" />
              <button type="button" class="password-field__toggle" data-toggle-password="reset-confirm" aria-label="Show password">
                <svg class="eye eye--open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 12S5.5 5.5 12 5.5 22.5 12 22.5 12 18.5 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
                <svg class="eye eye--closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A11 11 0 0112 6c6.5 0 10.5 6 10.5 6a19 19 0 01-3.4 4M6.3 7.4A19 19 0 001.5 12S5.5 18 12 18a10.6 10.6 0 004.6-1"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn--solid btn--block" id="reset-submit">Save new password</button>
          <p class="form-note"><a href="auth.html">Back to log in</a></p>
        </form>
      </div>
    </section>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/reset.js"></script>
</body>
</html>
