name: CI

# Runs on every push and pull request. A failing check blocks the merge.
#
# The project runs on PostgreSQL only. The MongoDB job and suites were removed
# with the Mongoose code: they tested a backend that is no longer deployed, and
# a green result from them meant nothing.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry_ci_only
          POSTGRES_DB: foundry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://foundry:foundry_ci_only@localhost:5432/foundry_test
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (reproducible)
        working-directory: backend
        run: npm ci

      - name: Syntax check every JavaScript file
        working-directory: backend
        run: |
          find src scripts test -name '*.js' -print0 | xargs -0 -n1 node --check
          find ../frontend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: No file may still import Mongoose
        working-directory: backend
        run: |
          if grep -rn "require('mongoose')\|require(\"mongoose\")" src scripts test; then
            echo "::error::Mongoose is still imported somewhere; the migration is incomplete."
            exit 1
          fi
          echo "No Mongoose imports remain."

      - name: Apply the schema
        working-directory: backend
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Apply the schema a second time (it must be idempotent)
        working-directory: backend
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Auth unit tests (no database needed)
        working-directory: backend
        run: npm run test:auth-v2

      - name: PostgreSQL integration tests
        working-directory: backend
        run: npm run test:pg

      - name: Boot the real server against Postgres
        working-directory: backend
        run: npm run test:boot-v2

      - name: Seed the database for the browser tests
        working-directory: backend
        run: npm run seed:browser

      - name: Install the browser
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Browser tests (real Chromium against the real backend)
        working-directory: backend
        run: npm run test:browser

      - name: Keep the browser report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/test-results
          if-no-files-found: ignore

      - name: Dependency vulnerability audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Keep the output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: backend/*.log
          if-no-files-found: ignore
