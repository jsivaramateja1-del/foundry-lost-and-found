name: Weekly audit

# A weekly dependency and schema check. The previous version called eight npm
# scripts that were deleted with the MongoDB layer, so it would have failed on
# its first step every Monday.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry_ci_only
          POSTGRES_DB: foundry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://foundry:foundry_ci_only@localhost:5432/foundry_test
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Apply the schema
        working-directory: backend
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Integration tests
        working-directory: backend
        run: npm run test:pg

      - name: Boot test
        working-directory: backend
        run: npm run test:boot-v2

      - name: Deploy command check
        working-directory: backend
        run: npm run test:deploy

      - name: No Mongoose may have crept back in
        working-directory: backend
        run: |
          if grep -rn "require('mongoose')" src scripts test; then
            echo "::error::Mongoose reappeared; the migration is regressing."
            exit 1
          fi
